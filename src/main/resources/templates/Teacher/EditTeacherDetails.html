```html
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Teacher | Student Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
            rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/teacher.css}">
</head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-wrapper">

    <main class="page-content">

        <!-- Page Heading -->
        <div class="page-heading">

            <div>
                <h3>
                    <i class="bi bi-pencil-square"></i>
                    Edit Teacher
                </h3>

                <p>Update teacher information</p>
            </div>

            <a th:href="@{/teacher/teacherList}" class="back-button">
                <i class="bi bi-arrow-left"></i>
                Back to Teacher
            </a>

        </div>


        <!-- Edit Teacher Card -->
        <div class="teacher-form-card">

            <!-- Card Header -->
            <div class="teacher-form-header">

                <div class="form-header-icon">
                    <i class="bi bi-person-workspace"></i>
                </div>

                <div>
                    <h5>Teacher Information</h5>
                    <p>Update the teacher's personal information</p>
                </div>

            </div>


            <!-- Form Body -->
            <div class="teacher-form-body">

                <form th:action="@{/teacher/updateTeacher}"
                        th:object="${teacher}"
                        method="post">

                    <input type="hidden" th:field="*{id}">


                    <!-- Personal Information -->
                    <div class="form-section-title">

                        <div class="section-icon">
                            <i class="bi bi-person-fill"></i>
                        </div>

                        <div>
                            <h5>Personal Information</h5>
                            <p>Update basic teacher details</p>
                        </div>

                    </div>


                    <div class="row g-4">

                        <!-- Name -->
                        <div class="col-md-6">

                            <label for="name" class="custom-label">
                                Teacher Name <span>*</span>
                            </label>

                            <div class="custom-input-group">

                                <i class="bi bi-person"></i>

                                <input type="text"
                                        id="name"
                                        th:field="*{name}"
                                        placeholder="Enter teacher name"
                                        required>

                            </div>

                        </div>


                        <!-- Email -->
                        <div class="col-md-6">

                            <label for="email" class="custom-label">
                                Email <span>*</span>
                            </label>

                            <div class="custom-input-group">

                                <i class="bi bi-envelope"></i>

                                <input type="email"
                                        id="email"
                                        th:field="*{email}"
                                        placeholder="Enter email address"
                                        required>

                            </div>

                        </div>


                        <!-- Phone -->
                        <div class="col-md-6">

                            <label for="phoneNumber" class="custom-label">
                                Phone Number <span>*</span>
                            </label>

                            <div class="custom-input-group">

                                <i class="bi bi-telephone"></i>

                                <input type="text"
                                        id="phoneNumber"
                                        th:field="*{phoneNumber}"
                                        placeholder="Enter phone number"
                                        required>

                            </div>

                        </div>


                        <!-- Address -->
                        <div class="col-md-6">

                            <label for="address" class="custom-label">
                                Address <span>*</span>
                            </label>

                            <div class="custom-input-group">

                                <i class="bi bi-geo-alt"></i>

                                <input type="text"
                                        id="address"
                                        th:field="*{address}"
                                        placeholder="Enter address"
                                        required>

                            </div>

                        </div>


                        <!-- Qualification -->
                        <div class="col-md-6">

                            <label for="qualification" class="custom-label">
                                Qualification <span>*</span>
                            </label>

                            <div class="custom-input-group">

                                <i class="bi bi-mortarboard"></i>

                                <input type="text"
                                        id="qualification"
                                        th:field="*{qualification}"
                                        placeholder="Enter qualification"
                                        required>

                            </div>

                        </div>

                    </div>


                    <!-- Buttons -->
                    <div class="form-actions">

                        <a th:href="@{/teacher/teacherList}"
                                class="reset-button">

                            <i class="bi bi-x-circle"></i>
                            Cancel

                        </a>

                        <button type="submit" class="save-button">

                            <i class="bi bi-check-circle"></i>
                            Update Teacher

                        </button>

                    </div>


                    <!-- Note -->
                    <div class="form-note">

                        <i class="bi bi-info-circle"></i>

                        <span>
                            Make sure all teacher information is correct before updating.
                        </span>

                    </div>

                </form>

            </div>

        </div>


        <!-- Footer -->
        <div th:replace="~{fragments/footer :: footer}"></div>

    </main>

</div>

</body>
</html>
```
