<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #DBDBE5;
            font-family: Arial, sans-serif;
            color: #21222D;
        }

        /* Sidebar */

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 230px;
            height: 100vh;
            background: #21222D;
            padding: 25px 15px;
        }

        .sidebar-title {
            color: white;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 35px;
        }

        .sidebar-title i {
            color: #ACD1FD;
            margin-right: 7px;
        }

        .sidebar a {
            display: block;
            text-decoration: none;
            color: #DBDBE5;
            padding: 11px 14px;
            margin-bottom: 7px;
            border-radius: 7px;
            font-size: 14px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #958CE8;
            color: white;
        }

        .sidebar a i {
            margin-right: 10px;
        }

        /* Main */

        .main-content {
            margin-left: 230px;
            padding: 30px;
        }

        .page-header {
            background: #21222D;
            color: white;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 25px;
        }

        .page-header h2 {
            font-size: 23px;
            margin-bottom: 5px;
        }

        .page-header p {
            color: #DBDBE5;
            font-size: 14px;
            margin: 0;
        }

        /* Form */

        .form-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07);
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #21222D;
        }

        .form-control,
        .form-select {
            border: 1px solid #DBDBE5;
            border-radius: 7px;
            padding: 9px 12px;
            font-size: 14px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #958CE8;
            box-shadow: 0 0 0 2px rgba(149, 140, 232, 0.15);
        }

        .readonly-field {
            background: #DBDBE5;
            cursor: not-allowed;
        }

        /* Buttons */

        .btn-purple {
            background: #958CE8;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 9px 20px;
            font-size: 13px;
        }

        .btn-purple:hover {
            background: #8178d5;
            color: white;
        }

        .btn-secondary-custom {
            background: #DBDBE5;
            color: #21222D;
            border: none;
            border-radius: 7px;
            padding: 9px 20px;
            text-decoration: none;
            font-size: 13px;
        }

        .btn-secondary-custom:hover {
            background: #ACD1FD;
            color: #21222D;
        }

    </style>

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

    <div class="sidebar-title">
        <i class="bi bi-person-workspace"></i>
        Teacher Portal
    </div>

    <a th:href="@{/teacher/dashboard}">
        <i class="bi bi-speedometer2"></i>
        Dashboard
    </a>

    <a th:href="@{/teacher/profile}">
        <i class="bi bi-person-circle"></i>
        My Profile
    </a>

    <a th:href="@{/teacher/profile/edit}" class="active">
        <i class="bi bi-pencil-square"></i>
        Edit Profile
    </a>

    <a th:href="@{/teacher/subjects}">
        <i class="bi bi-book-fill"></i>
        My Subjects
    </a>

    <form th:action="@{/logout}" method="post" style="display: inline;">
        <button type="submit" class="sidebar-link">
            <i class="bi bi-box-arrow-right"></i>
            Logout
        </button>
    </form>

</div>


<!-- Main Content -->

<div class="main-content">

    <div class="page-header">

        <h2>
            <i class="bi bi-pencil-square"></i>
            Edit Profile </h2>

        <p>
            Update your personal information </p>

    </div>


    <div class="form-card">

        <form th:action="@{/teacher/profile/update}" th:object="${teacher}" method="post">


            <div class="row">

                <!-- Name -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Teacher Name
                    </label>

                    <input type="text" class="form-control" th:field="*{name}" required>

                </div>


                <!-- Email -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input type="email" class="form-control" th:field="*{email}" required>

                </div>


                <!-- Phone -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Phone Number
                    </label>

                    <input type="text" class="form-control" th:field="*{phoneNumber}" required>

                </div>


                <!-- Address -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Address
                    </label>

                    <input type="text" class="form-control" th:field="*{address}" required>

                </div>


                <!-- Gender -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Gender
                    </label>

                    <select class="form-select" th:field="*{gender}" required>

                        <option value="">
                            Select Gender
                        </option>

                        <option value="MALE">
                            Male
                        </option>

                        <option value="FEMALE">
                            Female
                        </option>

                        <option value="OTHER">
                            Other
                        </option>

                    </select>

                </div>

            </div>


            <div class="mt-3">

                <button type="submit" class="btn-purple">

                    <i class="bi bi-check-circle"></i>
                    Update Profile

                </button>


                <a th:href="@{/teacher/profile}" class="btn-secondary-custom">

                    <i class="bi bi-x-circle"></i>
                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
