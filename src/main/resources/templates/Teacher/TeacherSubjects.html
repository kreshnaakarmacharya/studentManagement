<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Subjects | Student Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/teacherSubject.css}">
</head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-wrapper">
    <main class="page-content">
        <!-- PAGE HEADING -->
        <div class="page-heading">
            <div class="heading-right"><a th:href="@{/teacher/teacherList}" class="back-button"> <i class="bi bi-arrow-left"></i> Back to Teachers </a></div>
        </div>

        <!-- ADD SUBJECT CARD -->
        <div class="teacher-subject-add-card">

            <div class="teacher-subject-card-header">

                <div>
                    <h5>
                        <i class="bi bi-plus-circle-fill"></i>
                        Assign Subject </h5>

                    <p>
                        Select a subject to assign to
                        <strong th:text="${teacher.name}">
                            Teacher Name
                        </strong></p>
                </div>

            </div>


            <div class="teacher-subject-add-body">

                <form th:action="@{'/teacher/' + ${teacher.id} + '/subjects/add'}" method="post">

                    <div class="row g-3 align-items-end">

                        <!-- SUBJECT SELECT -->
                        <div class="col-md-10">

                            <label for="subject" class="custom-label">

                                Select Subject <span>*</span>

                            </label>

                            <div class="custom-input-group">

                                <i class="bi bi-book-fill"></i>

                                <select id="subject" name="subjectId" required>

                                    <option value="">
                                        -- Select Subject --
                                    </option>

                                    <option th:each="subject : ${subjects}" th:value="${subject.id}" th:text="${subject.subjectCode + ' - ' + subject.subjectName}"></option>

                                </select>

                            </div>

                        </div>


                        <!-- ADD BUTTON -->
                        <div class="col-md-2">

                            <button type="submit" class="assign-button">

                                <i class="bi bi-plus-lg"></i>
                                Add

                            </button>

                        </div>

                    </div>

                </form>

            </div>

        </div>


        <!-- ASSIGNED SUBJECTS -->
        <div class="teacher-subject-list-card">

            <div class="teacher-subject-list-header">

                <div>
                    <h5>Assigned Subjects</h5>

                    <p>
                        Total Subjects:
                        <strong th:text="${#lists.size(teacher.subjects)}">
                            0
                        </strong>
                    </p>
                </div>

            </div>


            <div class="table-responsive">

                <table class="teacher-subject-table">

                    <thead>

                    <tr>

                        <th class="text-center" style="width: 55px;">
                            S.N
                        </th>

                        <th>Subject Code</th>

                        <th>Subject Name</th>

                        <th>Course</th>

                        <th>Semester</th>

                        <th class="text-center" style="width: 120px;">
                            Actions
                        </th>

                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="subject, stat : ${teacher.subjects}">

                        <!-- NUMBER -->
                        <td class="text-center" th:text="${stat.count}">
                            1
                        </td>


                        <!-- SUBJECT CODE -->
                        <td>

                            <span class="subject-code" th:text="${subject.subjectCode}">
                                SUB101
                            </span>

                        </td>


                        <!-- SUBJECT NAME -->
                        <td>

                            <div class="subject-info">

                                <div class="subject-avatar">

                                    <span th:text="${#strings.substring(subject.subjectName, 0, 1).toUpperCase()}">
                                        S
                                    </span>

                                </div>

                                <div>

                                    <div class="subject-name" th:text="${subject.subjectName}">
                                        Java Programming
                                    </div>

                                    <small>Subject</small>

                                </div>

                            </div>

                        </td>


                        <!-- COURSE -->
                        <td th:text="${subject.course.courseName}">
                            BIM
                        </td>


                        <!-- SEMESTER -->
                        <td th:text="${subject.semesterNumber}">
                            1
                        </td>


                        <!-- ACTIONS -->
                        <td>

                            <div class="subject-actions">

                                <a th:href="@{'/teacher/' + ${teacher.id} +
                                    '/subjects/delete/' + ${subject.id}}" class="table-action delete-action" title="Remove" onclick="return confirm('Are you sure you want to remove this subject?');">

                                    <i class="bi bi-trash"></i>

                                </a>

                            </div>

                        </td>

                    </tr>


                    <!-- EMPTY STATE -->
                    <tr th:if="${teacher.subjects == null or teacher.subjects.isEmpty()}">

                        <td colspan="6" class="empty-teacher-subjects">

                            <i class="bi bi-book"></i>

                            <p>
                                No subjects assigned to this teacher. </p>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <!-- FOOTER -->
        <div th:replace="~{fragments/footer :: footer}"></div>

    </main>
</div>

</body>
</html>
