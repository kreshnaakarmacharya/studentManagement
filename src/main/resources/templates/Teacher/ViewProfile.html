<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #DBDBE5;
            font-family: Arial, sans-serif;
            color: #21222D;
        }

        /* Sidebar */

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 230px;
            height: 100vh;
            background: #21222D;
            padding: 25px 15px;
        }

        .sidebar-title {
            color: white;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 35px;
        }

        .sidebar-title i {
            color: #ACD1FD;
            margin-right: 7px;
        }

        .sidebar a {
            display: block;
            text-decoration: none;
            color: #DBDBE5;
            padding: 11px 14px;
            margin-bottom: 7px;
            border-radius: 7px;
            font-size: 14px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #958CE8;
            color: white;
        }

        .sidebar a i {
            margin-right: 10px;
        }

        /* Main */

        .main-content {
            margin-left: 230px;
            padding: 30px;
        }

        .page-header {
            background: #21222D;
            color: white;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 25px;
        }

        .page-header h2 {
            font-size: 23px;
            margin-bottom: 5px;
        }

        .page-header p {
            color: #DBDBE5;
            font-size: 14px;
            margin: 0;
        }

        /* Profile Card */

        .profile-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07);
        }

        .profile-icon {
            width: 75px;
            height: 75px;
            background: #ACD1FD;
            color: #21222D;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 35px;
            margin: 0 auto 15px;
        }

        .teacher-name {
            text-align: center;
            font-size: 21px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .info-box {
            background: #f7f7fa;
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 15px;
        }

        .info-label {
            font-size: 12px;
            color: #777;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 14px;
            font-weight: 500;
        }

        /* Buttons */

        .btn-purple {
            background: #958CE8;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 9px 18px;
            text-decoration: none;
            font-size: 13px;
        }

        .btn-purple:hover {
            background: #8178d5;
            color: white;
        }

        .btn-secondary-custom {
            background: #DBDBE5;
            color: #21222D;
            border: none;
            border-radius: 7px;
            padding: 9px 18px;
            text-decoration: none;
            font-size: 13px;
        }

        .btn-secondary-custom:hover {
            background: #ACD1FD;
            color: #21222D;
        }

    </style>

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

    <div class="sidebar-title">
        <i class="bi bi-person-workspace"></i>
        Teacher Portal
    </div>

    <a th:href="@{/teacher/dashboard}">
        <i class="bi bi-speedometer2"></i>
        Dashboard
    </a>

    <a th:href="@{/teacher/profile}" class="active">
        <i class="bi bi-person-circle"></i>
        My Profile
    </a>

    <a th:href="@{/teacher/profile/edit}">
        <i class="bi bi-pencil-square"></i>
        Edit Profile
    </a>

    <a th:href="@{/teacher/subjects}">
        <i class="bi bi-book-fill"></i>
        My Subjects
    </a>

    <form th:action="@{/logout}" method="post" style="display: inline;">
        <button type="submit" class="sidebar-link">
            <i class="bi bi-box-arrow-right"></i>
            Logout
        </button>
    </form>

</div>


<!-- Main Content -->

<div class="main-content">

    <div class="page-header">

        <h2>
            <i class="bi bi-person-circle"></i>
            My Profile </h2>

        <p>
            View your personal information </p>

    </div>


    <div class="profile-card">

        <div class="profile-icon">
            <i class="bi bi-person"></i>
        </div>

        <div class="teacher-name" th:text="${teacher.name}">
            Teacher Name
        </div>


        <div class="row">

            <!-- Name -->

            <div class="col-md-6">

                <div class="info-box">

                    <div class="info-label">
                        Name
                    </div>

                    <div class="info-value" th:text="${teacher.name}">
                        -
                    </div>

                </div>

            </div>


            <!-- Email -->

            <div class="col-md-6">

                <div class="info-box">

                    <div class="info-label">
                        Email
                    </div>

                    <div class="info-value" th:text="${teacher.email}">
                        -
                    </div>

                </div>

            </div>


            <!-- Phone -->

            <div class="col-md-6">

                <div class="info-box">

                    <div class="info-label">
                        Phone Number
                    </div>

                    <div class="info-value" th:text="${teacher.phoneNumber}">
                        -
                    </div>

                </div>

            </div>


            <!-- Address -->

            <div class="col-md-6">

                <div class="info-box">

                    <div class="info-label">
                        Address
                    </div>

                    <div class="info-value" th:text="${teacher.address}">
                        -
                    </div>

                </div>

            </div>


            <!-- Gender -->

            <div class="col-md-6">

                <div class="info-box">

                    <div class="info-label">
                        Gender
                    </div>

                    <div class="info-value" th:text="${teacher.gender}">
                        -
                    </div>

                </div>

            </div>

        </div>


        <div class="mt-3">

            <a th:href="@{/teacher/profile/edit}" class="btn-purple">

                <i class="bi bi-pencil-square"></i>
                Edit Profile

            </a>

            <a th:href="@{/teacher/dashboard}" class="btn-secondary-custom">

                <i class="bi bi-arrow-left"></i>
                Dashboard

            </a>

        </div>

    </div>

</div>

</body>

</html>
