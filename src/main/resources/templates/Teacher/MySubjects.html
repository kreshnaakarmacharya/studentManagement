```html
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Subjects</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 0;
            background: #DBDBE5;
            font-family: Arial, sans-serif;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 230px;
            height: 100vh;
            background: #21222D;
            padding: 25px 15px;
        }

        .sidebar-title {
            color: white;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 35px;
        }

        .sidebar-title i {
            color: #ACD1FD;
            margin-right: 7px;
        }

        .sidebar a {
            display: block;
            text-decoration: none;
            color: #DBDBE5;
            padding: 11px 14px;
            margin-bottom: 7px;
            border-radius: 7px;
            font-size: 14px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #958CE8;
            color: white;
        }

        .sidebar a i {
            margin-right: 10px;
        }


        /* Main Content */
        .main-content {
            margin-left: 230px;
            padding: 30px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-header h3 {
            color: #21222D;
            margin: 0;
        }

        /* Table Container */
        .table-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .table {
            margin-bottom: 0;
        }

        .table thead th {
            background: #21222D;
            color: white;
            border: none;
            padding: 12px;
        }

        .table tbody td {
            padding: 12px;
            vertical-align: middle;
        }

        .table tbody tr:hover {
            background: #f3f2fc;
        }

        .subject-code {
            font-weight: 600;
            color: #958CE8;
        }

        .semester-badge {
            background: #ACD1FD;
            color: #21222D;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: 600;
        }

        .course-badge {
            background: #958CE8;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 13px;
        }

        .empty-box {
            background: white;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            color: #777;
        }

        .empty-box i {
            font-size: 40px;
            color: #958CE8;
        }

        .btn-dashboard {
            background: #958CE8;
            color: white;
            border: none;
        }

        .btn-dashboard:hover {
            background: #7e75d5;
            color: white;
        }

        @media (max-width: 768px) {

            .sidebar {
                width: 190px;
            }

            .main-content {
                margin-left: 190px;
                padding: 20px;
            }

            .table-container {
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>


<div class="sidebar">

    <div class="sidebar-title">
        <i class="bi bi-person-workspace"></i>
        Teacher Portal
    </div>

    <a th:href="@{/teacher/dashboard}" class="active">
        <i class="bi bi-speedometer2"></i>
        Dashboard
    </a>

    <a th:href="@{/teacher/profile}">
        <i class="bi bi-person-circle"></i>
        My Profile
    </a>

    <a th:href="@{/teacher/profile/edit}">
        <i class="bi bi-pencil-square"></i>
        Edit Profile
    </a>

    <a th:href="@{/teacher/subjects}">
        <i class="bi bi-book-fill"></i>
        My Subjects
    </a>

    <form th:action="@{/logout}" method="post" style="display: inline;">
        <button type="submit" class="sidebar-link">
            <i class="bi bi-box-arrow-right"></i>
            Logout
        </button>
    </form>

</div>
<!-- Main Content -->
<div class="main-content">

    <div class="page-header">

        <h3>
            <i class="bi bi-book-fill"></i>
            My Subjects
        </h3>

        <a th:href="@{/teacher/dashboard}"
                class="btn btn-dashboard btn-sm">

            <i class="bi bi-arrow-left"></i>
            Dashboard

        </a>

    </div>


    <!-- No Subjects -->
    <div th:if="${#lists.isEmpty(subjects)}"
            class="empty-box">

        <i class="bi bi-book"></i>

        <h5 class="mt-3">
            No Subjects Assigned
        </h5>

        <p class="mb-0">
            You currently don't have any subjects assigned.
        </p>

    </div>


    <!-- Subjects Table -->
    <div th:unless="${#lists.isEmpty(subjects)}"
            class="table-container">

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>
                <tr>
                    <th>S.N</th>
                    <th>Subject Code</th>
                    <th>Subject Name</th>
                    <th>Course</th>
                    <th>Semester</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="subject, stat : ${subjects}">

                    <td th:text="${stat.count}">
                        1
                    </td>

                    <td>
                        <span class="subject-code"
                                th:text="${subject.subjectCode}">
                            CS101
                        </span>
                    </td>

                    <td th:text="${subject.subjectName}">
                        Java Programming
                    </td>

                    <td>
                        <span class="course-badge"
                                th:text="${subject.course.courseName}">
                            BIM
                        </span>
                    </td>

                    <td>
                        <span class="semester-badge"
                                th:text="${subject.semesterNumber}">
                            3rd
                        </span>
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
```
