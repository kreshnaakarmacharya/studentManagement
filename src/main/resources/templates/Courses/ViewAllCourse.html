<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Courses | Student Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/course.css}">

</head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-wrapper">

    <main class="page-content">
        <!-- Page Header -->
        <div class="page-heading">
            <div>
                <h3>
                    <i class="bi bi-book-fill"></i>
                    Courses List </h3>

                <p>Manage registered courses</p>
            </div>
            <div>
                <a th:href="@{/courses/addCourseForm}" class="course-add-button">
                    <i class="bi bi-plus-lg"></i>
                    Add Course
                </a>

            </div>

        </div>


        <!-- Course List Card -->
        <div class="course-list-card">

            <!-- Header -->
            <div class="course-list-header">

                <div>

                    <h5>All Courses</h5>

                    <p>
                        Total Courses:
                        <strong th:text="${#lists.size(courses)}">
                            0
                        </strong>
                    </p>

                </div>


                <!-- Search -->
                <div class="course-search">

                    <i class="bi bi-search"></i>

                    <input type="text" id="courseSearch" placeholder="Search courses...">

                </div>

            </div>


            <!-- Table -->
            <div class="table-responsive">

                <table class="course-list-table" id="courseTable">

                    <thead>

                    <tr>

                        <th class="text-center" style="width: 50px;">
                            #
                        </th>

                        <th>
                            Course
                        </th>

                        <th>
                            Course Code
                        </th>

                        <th>
                            Duration
                        </th>

                        <th>
                            Total Semester
                        </th>

                        <th>
                            Status
                        </th>

                        <th class="text-center" style="width: 150px;">
                            Actions
                        </th>

                    </tr>

                    </thead>


                    <tbody>

                    <!-- Course Row -->
                    <tr th:each="course, stat : ${courses}">

                        <td class="text-center" th:text="${stat.count}">
                            1
                        </td>


                        <!-- Course Name -->
                        <td>

                            <div class="course-info">

                                <div class="course-avatar">

                                    <span th:text="${#strings.substring(course.courseName, 0, 1).toUpperCase()}">
                                        C
                                    </span>

                                </div>

                                <div>

                                    <div class="course-name" th:text="${course.courseName}">
                                        Course Name
                                    </div>

                                    <small>
                                        Course
                                    </small>

                                </div>

                            </div>

                        </td>


                        <!-- Course Code -->
                        <td>

                            <span class="course-code" th:text="${course.courseCode}">
                                CS101
                            </span>

                        </td>


                        <!-- Duration -->
                        <td th:text="${course.duration}">
                            4 Years
                        </td>


                        <!-- Semester -->
                        <td th:text="${course.totalSemesters}">
                            8
                        </td>


                        <!-- Status -->
                        <td>

                            <span class="course-status" th:text="${course.status}">
                                Active
                            </span>

                        </td>


                        <!-- Actions -->
                        <td>

                            <div class="course-actions">

                                <!-- View -->
                                <a th:href="@{/courses/view/{id}(id=${course.id})}" class="table-action view-action" title="View">

                                    <i class="bi bi-eye"></i>

                                </a>


                                <!-- Edit -->
                                <a th:href="@{/courses/editCourse/{id}(id=${course.id})}" class="table-action edit-action" title="Edit">

                                    <i class="bi bi-pencil"></i>

                                </a>


                                <!-- Delete -->
                                <a th:href="@{/courses/deleteCourse/{id}(id=${course.id})}" class="table-action delete-action" title="Delete" onclick="return confirm('Are you sure you want to delete this course?');">

                                    <i class="bi bi-trash"></i>

                                </a>

                            </div>

                        </td>

                    </tr>


                    <!-- No Courses -->
                    <tr th:if="${#lists.isEmpty(courses)}">

                        <td colspan="7" class="empty-courses">

                            <i class="bi bi-book"></i>

                            <p>
                                No courses found. </p>

                        </td>

                    </tr>

                    <!-- No Search Result -->
                    <tr id="noSearchResult" style="display: none;">

                        <td colspan="7" class="empty-courses">

                            <i class="bi bi-search"></i>

                            <p>
                                No matching courses found. </p>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <!-- Footer -->
        <div th:replace="~{fragments/footer :: footer}"></div>

    </main>

</div>


<!-- Search -->
<script>

    const searchInput =
        document.getElementById("courseSearch");

    const tableRows =
        document.querySelectorAll("#courseTable tbody tr");

    const noSearchResult =
        document.getElementById("noSearchResult");


    searchInput.addEventListener("keyup", function () {

        const value =
            this.value.toLowerCase().trim();

        let visibleRows = 0;

        tableRows.forEach(function (row) {

            if (row.id === "noSearchResult") {
                return;
            }

            if (row.querySelector(".empty-courses")) {
                return;
            }

            const text =
                row.textContent.toLowerCase();

            if (text.includes(value)) {

                row.style.display = "";
                visibleRows++;

            } else {

                row.style.display = "none";

            }

        });


        if (value !== "" && visibleRows === 0) {

            noSearchResult.style.display = "";

        } else {

            noSearchResult.style.display = "none";

        }

    });

</script>


</body>
</html>
