<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Course | Student Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Common CSS -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">

    <!-- Course CSS -->
    <link rel="stylesheet" th:href="@{/css/course.css}">

</head>

<body>

<!-- Sidebar -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-wrapper">

    <main class="page-content">

        <!-- Page Heading -->
        <div class="page-heading">

            <div>

                <h3>
                    <i class="bi bi-book-fill"></i>
                    Add Course </h3>

                <p>Add a new course to the system</p>

            </div>

            <a th:href="@{/courses/courseList}" class="back-button">

                <i class="bi bi-arrow-left"></i>
                Back to Course

            </a>

        </div>


        <!-- Course Form Card -->
        <div class="course-form-card">

            <!-- Form Header -->
            <div class="course-form-header">

                <div class="form-header-icon">
                    <i class="bi bi-book-fill"></i>
                </div>

                <div>

                    <h5>Course Information</h5>

                    <p>Enter the details of the new course</p>

                </div>

            </div>


            <!-- Form Body -->
            <div class="course-form-body">

                <form th:action="@{/courses/addCourse}" method="post">


                    <!-- Basic Information -->
                    <div class="form-section-title">

                        <div class="section-icon">
                            <i class="bi bi-info-circle-fill"></i>
                        </div>

                        <div>

                            <h5>Basic Information</h5>

                            <p>Enter the basic course details</p>

                        </div>

                    </div>


                    <div class="row g-4">

                        <!-- Course Code -->
                        <div class="col-md-6">

                            <label for="courseCode" class="custom-label">

                                Course Code
                                <span>*</span>

                            </label>

                            <div class="custom-input-group">

                                <i class="bi bi-hash"></i>

                                <input type="text" id="courseCode" name="courseCode" placeholder="Enter course code" required>

                            </div>

                        </div>


                        <!-- Course Name -->
                        <div class="col-md-6">

                            <label for="courseName" class="custom-label">

                                Course Name
                                <span>*</span>

                            </label>

                            <div class="custom-input-group">

                                <i class="bi bi-book"></i>

                                <input type="text" id="courseName" name="courseName" placeholder="Enter course name" required>

                            </div>

                        </div>


                        <!-- Duration -->
                        <div class="col-md-6">

                            <label for="duration" class="custom-label">

                                Duration
                                <span>*</span>

                            </label>

                            <div class="custom-input-group">

                                <i class="bi bi-clock-fill"></i>

                                <input type="text" id="duration" name="duration" placeholder="e.g. 4 Years" required>

                            </div>

                        </div>


                        <!-- Total Semesters -->
                        <div class="col-md-6">

                            <label for="totalSemesters" class="custom-label">

                                Total Semesters
                                <span>*</span>

                            </label>

                            <div class="custom-input-group">

                                <i class="bi bi-layers-fill"></i>

                                <input type="number" id="totalSemesters" name="totalSemesters" placeholder="Enter total semesters" min="1" required>

                            </div>

                        </div>


                        <!-- Status -->
                        <div class="col-md-6">

                            <label for="status" class="custom-label">

                                Status
                                <span>*</span>

                            </label>

                            <div class="custom-input-group">

                                <i class="bi bi-toggle-on"></i>

                                <select id="status" name="status" required>

                                    <option value="">
                                        Select Status
                                    </option>

                                    <option value="Active">
                                        Active
                                    </option>

                                    <option value="Inactive">
                                        Inactive
                                    </option>

                                </select>

                            </div>

                        </div>

                    </div>


                    <!-- Divider -->
                    <div class="form-divider"></div>


                    <!-- Form Actions -->
                    <div class="form-actions">

                        <button type="reset" class="reset-button">

                            <i class="bi bi-arrow-counterclockwise"></i>
                            Reset

                        </button>

                        <button type="submit" class="save-button">

                            <i class="bi bi-check-lg"></i>
                            Add Course

                        </button>

                    </div>


                    <!-- Form Note -->
                    <div class="form-note">

                        <i class="bi bi-info-circle-fill"></i>

                        <span>
                            Fields marked with
                            <strong>*</strong>
                            are required.
                        </span>

                    </div>

                </form>

            </div>

        </div>


        <!-- Footer -->
        <div th:replace="~{fragments/footer :: footer}"></div>

    </main>

</div>


</body>
</html>
