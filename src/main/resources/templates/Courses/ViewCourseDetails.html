<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Details | Student Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Common CSS -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">

    <!-- Course CSS -->
    <link rel="stylesheet" th:href="@{/css/course.css}">

</head>

<body>

<!-- Sidebar -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-wrapper">

    <main class="page-content">

        <!-- Page Heading -->
        <div class="page-heading">

            <div>

                <h3>
                    <i class="bi bi-book-fill"></i>
                    Course Details </h3>

                <p>View course information</p>

            </div>

            <a th:href="@{/courses/courseList}" class="back-button">

                <i class="bi bi-arrow-left"></i>
                Back to Course

            </a>

        </div>


        <!-- Course Details Card -->
        <div class="course-details-card">

            <!-- Details Header -->
            <div class="course-details-header">

                <div class="details-profile-icon">

                    <span th:text="${#strings.substring(course.courseName, 0, 1).toUpperCase()}">
                        C
                    </span>

                </div>

                <div>

                    <h5 th:text="${course.courseName}">
                        Course Name </h5>

                    <p>Course Information</p>

                </div>

                <!-- View Subjects -->
                <a th:href="@{/subjects/subjectList(courseId=${course.id})}" class="course-subjects-button">

                    <i class="bi bi-book-half"></i>
                    View Subjects

                </a>

            </div>


            <!-- Details Body -->
            <div class="course-details-body">

                <!-- Course Code -->
                <div class="detail-item">

                    <div class="detail-icon">
                        <i class="bi bi-hash"></i>
                    </div>

                    <div class="detail-content">

                        <span class="detail-label">
                            Course Code
                        </span>

                        <span class="detail-value" th:text="${course.courseCode}">
                            CS101
                        </span>

                    </div>

                </div>


                <!-- Course Name -->
                <div class="detail-item">

                    <div class="detail-icon">
                        <i class="bi bi-book-fill"></i>
                    </div>

                    <div class="detail-content">

                        <span class="detail-label">
                            Course Name
                        </span>

                        <span class="detail-value" th:text="${course.courseName}">
                            Bachelor of Information Management
                        </span>

                    </div>

                </div>


                <!-- Duration -->
                <div class="detail-item">

                    <div class="detail-icon">
                        <i class="bi bi-clock-fill"></i>
                    </div>

                    <div class="detail-content">

                        <span class="detail-label">
                            Duration
                        </span>

                        <span class="detail-value" th:text="${course.duration}">
                            4 Years
                        </span>

                    </div>

                </div>


                <!-- Total Semester -->
                <div class="detail-item">

                    <div class="detail-icon">
                        <i class="bi bi-layers-fill"></i>
                    </div>

                    <div class="detail-content">

                        <span class="detail-label">
                            Total Semesters
                        </span>

                        <span class="detail-value" th:text="${course.totalSemesters}">
                            8
                        </span>

                    </div>

                </div>


                <!-- Status -->
                <div class="detail-item">

                    <div class="detail-icon">
                        <i class="bi bi-toggle-on"></i>
                    </div>

                    <div class="detail-content">

                        <span class="detail-label">
                            Status
                        </span>

                        <span class="detail-value" th:text="${course.status}">
                            Active
                        </span>

                    </div>

                </div>

            </div>


            <!-- Actions -->
            <div class="course-details-actions">

                <a th:href="@{/courses/editCourse/{id}(id=${course.id})}" class="details-edit-button">

                    <i class="bi bi-pencil-square"></i>
                    Edit Course

                </a>

                <a th:href="@{/courses/courseList}" class="details-back-button">

                    <i class="bi bi-arrow-left"></i>
                    Back to Course

                </a>

            </div>

        </div>


        <!-- Footer -->
        <div th:replace="~{fragments/footer :: footer}"></div>

    </main>

</div>

</body>
</html>
