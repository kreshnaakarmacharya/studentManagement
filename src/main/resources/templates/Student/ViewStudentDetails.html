<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Details | Student Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Admin CSS -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">

    <!-- Student CSS -->
    <link rel="stylesheet" th:href="@{/css/student.css}">
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>


<!-- MAIN CONTENT -->
<div class="main-wrapper">

    <main class="page-content">

        <!-- PAGE HEADING -->
        <div class="page-heading">

            <div>
                <h3>
                    <i class="bi bi-person-vcard"></i>
                    Student Details </h3>

                <p>
                    View complete information about the student. </p>
            </div>

            <a th:href="@{/students/studentList}" class="back-button">

                <i class="bi bi-arrow-left"></i>
                Back to Students

            </a>

        </div>


        <!-- STUDENT DETAILS CARD -->
        <div class="student-details-card">

            <!-- CARD HEADER -->
            <div class="student-details-header">

                <div class="details-profile-icon">

                    <span th:text="${#strings.substring(student.name, 0, 1).toUpperCase()}">
                        J
                    </span>

                </div>

                <div>

                    <h5 th:text="${student.name}">
                        John Doe </h5>

                    <p>
                        Student Information </p>

                </div>

            </div>


            <!-- STUDENT INFORMATION -->
            <div class="student-details-body">

                <!-- STUDENT CODE -->
                <div class="detail-item">

                    <div class="detail-icon">
                        <i class="bi bi-person-badge"></i>
                    </div>

                    <div class="detail-content">

                        <span class="detail-label">
                            Student Code
                        </span>

                        <span class="detail-value" th:text="${student.stdCode}">
                            STU001
                        </span>

                    </div>

                </div>


                <!-- NAME -->
                <div class="detail-item">

                    <div class="detail-icon">
                        <i class="bi bi-person"></i>
                    </div>

                    <div class="detail-content">

                        <span class="detail-label">
                            Student Name
                        </span>

                        <span class="detail-value" th:text="${student.name}">
                            John Doe
                        </span>

                    </div>

                </div>


                <!-- EMAIL -->
                <div class="detail-item">

                    <div class="detail-icon">
                        <i class="bi bi-envelope"></i>
                    </div>

                    <div class="detail-content">

                        <span class="detail-label">
                            Email Address
                        </span>

                        <span class="detail-value" th:text="${student.email}">
                            example@email.com
                        </span>

                    </div>

                </div>


                <!-- PHONE -->
                <div class="detail-item">

                    <div class="detail-icon">
                        <i class="bi bi-telephone"></i>
                    </div>

                    <div class="detail-content">

                        <span class="detail-label">
                            Phone Number
                        </span>

                        <span class="detail-value" th:text="${student.phoneNumber}">
                            9800000000
                        </span>

                    </div>

                </div>


                <!-- ADDRESS -->
                <div class="detail-item">

                    <div class="detail-icon">
                        <i class="bi bi-geo-alt"></i>
                    </div>

                    <div class="detail-content">

                        <span class="detail-label">
                            Address
                        </span>

                        <span class="detail-value" th:text="${student.address}">
                            Kathmandu, Nepal
                        </span>

                    </div>

                </div>


                <!-- COURSE -->
                <div class="detail-item">

                    <div class="detail-icon">
                        <i class="bi bi-mortarboard-fill"></i>
                    </div>

                    <div class="detail-content">

                        <span class="detail-label">
                            Course
                        </span>

                        <span class="course-badge" th:text="${student.course}">
                            BIM
                        </span>

                    </div>

                </div>


                <!-- GENDER -->
                <div class="detail-item">

                    <div class="detail-icon">
                        <i class="bi bi-gender-ambiguous"></i>
                    </div>

                    <div class="detail-content">

                        <span class="detail-label">
                            Gender
                        </span>

                        <span class="detail-value" th:text="${student.gender}">
                            Male
                        </span>

                    </div>

                </div>

            </div>


            <!-- CARD ACTIONS -->
            <div class="student-details-actions">

                <a th:href="@{/students/std/edit/{id}(id=${student.id})}" class="details-edit-button">

                    <i class="bi bi-pencil"></i>
                    Edit Student

                </a>

                <a th:href="@{/students/studentList}" class="details-back-button">

                    <i class="bi bi-arrow-left"></i>
                    Back

                </a>

            </div>

        </div>


        <!-- FOOTER -->
        <div th:replace="~{fragments/footer :: footer}"></div>

    </main>

</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
