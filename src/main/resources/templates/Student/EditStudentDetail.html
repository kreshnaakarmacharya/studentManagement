<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Detail Edit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container-fluid mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white text-center py-3">
            <h1 class="h3 mb-0">✏️ Student Detail Edit</h1>
        </div>
        <div class="card-body">
            <form action="/std/update" method="post" th:object="${stdedit}">
                <div class="mb-3 row align-items-center">
                    <label for="name" class="col-sm-2 col-form-label fw-bold">Name:</label>
                    <div class="col-sm-10">
                        <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Enter Name">
                    </div>
                </div>
                <div class="mb-3 row align-items-center">
                    <label for="email" class="col-sm-2 col-form-label fw-bold">Email:</label>
                    <div class="col-sm-10">
                        <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="Enter Email">
                    </div>
                </div>
                <div class="mb-3 row align-items-center">
                    <label for="address" class="col-sm-2 col-form-label fw-bold">Address:</label>
                    <div class="col-sm-10">
                        <input type="text" id="address" th:field="*{address}" class="form-control" placeholder="Enter Address">
                    </div>
                </div>
                <div class="mb-3 row align-items-center">
                    <label for="mathMarks" class="col-sm-2 col-form-label fw-bold">Math Marks:</label>
                    <div class="col-sm-10">
                        <input type="text" id="mathMarks" th:field="*{mathMarks}" class="form-control" placeholder="Enter Math Marks">
                    </div>
                </div>
                <div class="mb-3 row align-items-center">
                    <label for="socialMarks" class="col-sm-2 col-form-label fw-bold">Social Marks:</label>
                    <div class="col-sm-10">
                        <input type="text" id="socialMarks" th:field="*{socialMarks}" class="form-control" placeholder="Enter Social Marks">
                    </div>
                </div>
                <div class="mb-3 row align-items-center">
                    <label for="totalMarks" class="col-sm-2 col-form-label fw-bold">Total Marks:</label>
                    <div class="col-sm-10">
                        <input type="text" id="totalMarks" th:field="*{totalMarks}" class="form-control" placeholder="Enter Total Marks">
                    </div>
                </div>
                <input type="hidden" th:field="*{id}">
                <div class="mb-3 row">
                    <div class="col-sm-4"></div>
                    <div class="col-sm-8">
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>
                </div>
            </form>
        </div>
        <div class="card-footer"></div>
    </div>
</div>
</body>
</html>
