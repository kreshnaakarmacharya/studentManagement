<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-sm navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="/home">Student Portal</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" href="/studentRegister">Student Register</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/studentList">Student List</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid">
  <div class="card">
    <div class="card-header bg-primary text-white text-center py-3">
      <h1 class="h3 mb-0">📋 Student Registration Form</h1>
    </div>
    <div class="card-body">
      <form  action="/studentregister" method="post">
        <div class="mb-3 row align-items-center">
          <label for="name" class="col-sm-2 col-form-label fw-bold">Name:</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name">
          </div>
        </div>
        <div class="mb-3 row align-items-center">
          <label for="email" class="col-sm-2 col-form-label fw-bold">Email:</label>
          <div class="col-sm-10">
            <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email">
          </div>
        </div>

        <div class="mb-3 row align-items-center">
          <label for="address" class="col-sm-2 col-form-label fw-bold">Address:</label>
          <div class="col-sm-10">
            <input type="text" id="address" name="address" class="form-control" placeholder="Enter your address">
          </div>
        </div>

        <div class="mb-3 row align-items-center">
          <label for="mathMarks" class="col-sm-2 col-form-label fw-bold">Math Marks:</label>
          <div class="col-sm-10">
            <input type="text" id="mathMarks" name="mathMarks" class="form-control" placeholder="Enter your Math Marks">
          </div>
        </div>

        <div class="mb-3 row align-items-center">
          <label for="socialMarks" class="col-sm-2 col-form-label fw-bold">Social Marks:</label>
          <div class="col-sm-10">
            <input type="text" id="socialMarks" name="socialMarks" class="form-control" placeholder="Enter your Social Marks">
          </div>
        </div>

        <div class="mb-3 row align-items-center">
          <label for="totalMarks" class="col-sm-2 col-form-label fw-bold">Total Marks:</label>
          <div class="col-sm-10">
            <input type="text" id="totalMarks" name="totalMarks" class="form-control" placeholder="Enter your Total Marks">
          </div>
        </div>
        <div class="mb-3 row">
          <div class="col-sm-4"></div>
          <div class="col-sm-8">
            <button type="submit" class="btn btn-primary">Submit</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

</body>
</html>
