<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #DBDBE5;
            font-family: Arial, sans-serif;
            color: #21222D;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            height: 100vh;
            background: #21222D;
            padding: 25px 16px;
            position: fixed;
            top: 0;
            left: 0;
            width: 16.666667%;
            overflow: hidden;
            z-index: 1000;
        }

        .portal-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 19px;
            font-weight: 600;
            padding: 5px 10px 28px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            margin-bottom: 25px;
        }

        .portal-logo i {
            color: #958CE8;
            font-size: 25px;
        }

        .menu-title {
            color: #8f909b;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 12px;
            margin-bottom: 10px;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #c9c9d2;
            text-decoration: none;
            padding: 12px 13px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 14px;
            transition: 0.2s ease;
        }

        .sidebar a i {
            font-size: 17px;
            width: 20px;
        }

        .sidebar a:hover {
            background: #302f40;
            color: white;
        }

        .sidebar a.active {
            background: #958CE8;
            color: white;
        }

        .logout {
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            padding-top: 20px;
        }

        .logout a:hover {
            background: rgba(172, 209, 253, 0.12);
            color: #ACD1FD;
        }

        /* ================= CONTENT ================= */

        .content {
            margin-left: 16.666667%;
            width: 83.333333%;
            min-height: 100vh;
            height: 100vh;
            padding: 30px 35px;
            overflow-y: auto;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-title {
            font-size: 25px;
            font-weight: 600;
            margin: 0;
        }

        .page-subtitle {
            color: #70717d;
            font-size: 13px;
            margin-top: 5px;
            margin-bottom: 0;
        }

        /* ================= FORM CARD ================= */

        .form-card {
            background: white;
            border: none;
            border-radius: 13px;
            box-shadow: 0 3px 12px rgba(33, 34, 45, 0.07);
            max-width: 850px;
        }

        .form-header {
            background: #21222D;
            color: white;
            padding: 20px 24px;
            border-radius: 13px 13px 0 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .form-header-icon {
            width: 40px;
            height: 40px;
            background: #958CE8;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .form-header h5 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }

        .form-header p {
            margin: 3px 0 0;
            color: #bfc0c9;
            font-size: 11px;
        }

        .form-body {
            padding: 25px;
        }

        /* ================= FORM GROUP ================= */

        .form-label {
            font-size: 12px;
            font-weight: 600;
            color: #3c3d48;
            margin-bottom: 7px;
        }

        .input-group-text {
            background: #DBDBE5;
            border: 1px solid #d4d4df;
            color: #958CE8;
            min-width: 42px;
            justify-content: center;
        }

        .form-control,
        .form-select {
            border: 1px solid #d4d4df;
            font-size: 13px;
            padding: 9px 11px;
            border-radius: 7px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #958CE8;
            box-shadow: 0 0 0 0.15rem rgba(149, 140, 232, 0.18);
        }

        .form-control[readonly] {
            background: #DBDBE5;
            color: #666775;
        }

        /* ================= INFO BOX ================= */

        .readonly-note {
            background: #ACD1FD;
            border-radius: 8px;
            padding: 10px 13px;
            margin-bottom: 22px;
            font-size: 11px;
            color: #394351;
        }

        .readonly-note i {
            color: #21222D;
            margin-right: 5px;
        }

        /* ================= BUTTONS ================= */

        .btn-update {
            background: #958CE8;
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 7px;
            font-size: 12px;
            transition: 0.2s ease;
        }

        .btn-update:hover {
            background: #8178d4;
            color: white;
        }

        .btn-cancel {
            background: #DBDBE5;
            color: #21222D;
            border: none;
            padding: 9px 18px;
            border-radius: 7px;
            font-size: 12px;
            text-decoration: none;
            transition: 0.2s ease;
        }

        .btn-cancel:hover {
            background: #c8c8d3;
            color: #21222D;
        }

        /* ================= RESPONSIVE ================= */
        @media (max-width: 768px) {

            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
                min-height: auto;
            }

            .content {
                margin-left: 0;
                width: 100%;
                height: auto;
                min-height: auto;
                overflow-y: visible;
                padding: 20px;
            }

        }

    </style>
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- ================= SIDEBAR ================= -->

        <div class="sidebar">

            <div class="portal-logo">
                <i class="bi bi-mortarboard-fill"></i>
                <span>Student Portal</span>
            </div>

            <div class="menu-title">
                Menu
            </div>

            <a th:href="@{/students/dashboard}">
                <i class="bi bi-grid-1x2-fill"></i>
                Dashboard
            </a>

            <a th:href="@{/students/profile}" class="active">
                <i class="bi bi-person"></i>
                My Profile
            </a>

            <div class="logout">

                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="sidebar-link">
                        <i class="bi bi-box-arrow-right"></i>
                        Logout
                    </button>
                </form>

            </div>

        </div>


        <!-- ================= MAIN CONTENT ================= -->

        <div class="content">

            <!-- Page Header -->

            <div class="page-header">

                <h2 class="page-title">
                    Edit Profile </h2>

                <p class="page-subtitle">
                    Update your personal information </p>

            </div>


            <!-- ================= FORM CARD ================= -->

            <div class="form-card">

                <!-- Header -->

                <div class="form-header">

                    <div class="form-header-icon">
                        <i class="bi bi-pencil-square"></i>
                    </div>

                    <div>

                        <h5>
                            Edit My Profile </h5>

                        <p>
                            Update your personal details below </p>

                    </div>

                </div>


                <!-- Form Body -->

                <div class="form-body">

                    <form th:action="@{/students/profile/update}" th:object="${student}" method="post">


                        <!-- Readonly Information -->

                        <div class="readonly-note">

                            <i class="bi bi-info-circle"></i>

                            Student Code and Course are managed by the
                            administration and cannot be changed.

                        </div>


                        <div class="row g-3">


                            <!-- Student Code -->

                            <div class="col-md-6">

                                <label class="form-label">
                                    Student Code
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-person-badge"></i>
                                    </span>

                                    <input type="text" class="form-control" th:value="${student.stdCode}" readonly>

                                </div>

                            </div>


                            <!-- Course -->

                            <div class="col-md-6">

                                <label class="form-label">
                                    Course
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-book"></i>
                                    </span>

                                    <input type="text" class="form-control" th:value="${student.course}" readonly>

                                </div>

                            </div>


                            <!-- Name -->

                            <div class="col-md-6">

                                <label for="name" class="form-label">
                                    Full Name
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-person"></i>
                                    </span>

                                    <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Enter your name" required>

                                </div>

                            </div>


                            <!-- Gender -->

                            <div class="col-md-6">

                                <label for="gender" class="form-label">
                                    Gender
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-gender-ambiguous"></i>
                                    </span>

                                    <select class="form-select" id="gender" th:field="*{gender}">

                                        <option value="">
                                            Select Gender
                                        </option>

                                        <option value="MALE">
                                            Male
                                        </option>

                                        <option value="FEMALE">
                                            Female
                                        </option>

                                        <option value="OTHER">
                                            Other
                                        </option>

                                    </select>

                                </div>

                            </div>


                            <!-- Address -->

                            <div class="col-md-6">

                                <label for="address" class="form-label">
                                    Address
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-geo-alt"></i>
                                    </span>

                                    <input type="text" class="form-control" id="address" th:field="*{address}" placeholder="Enter your address" required>

                                </div>

                            </div>


                            <!-- Phone -->

                            <div class="col-md-6">

                                <label for="phone" class="form-label">
                                    Phone Number
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-telephone"></i>
                                    </span>

                                    <input type="text" class="form-control" id="phone" th:field="*{phoneNumber}" placeholder="Enter your phone number" required>

                                </div>

                            </div>


                            <!-- Email -->

                            <div class="col-md-12">

                                <label for="email" class="form-label">
                                    Email Address
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-envelope"></i>
                                    </span>

                                    <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="Enter your email" required>

                                </div>

                            </div>

                        </div>


                        <!-- Buttons -->

                        <div class="d-flex gap-2 mt-4 pt-3" style="border-top: 1px solid #DBDBE5;">

                            <button type="submit" class="btn-update">

                                <i class="bi bi-check2"></i>

                                Save Changes

                            </button>

                            <a th:href="@{/students/profile}" class="btn-cancel">

                                <i class="bi bi-x-lg"></i>

                                Cancel

                            </a>

                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
