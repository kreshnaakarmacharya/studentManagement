<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Home Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container mt-5">
    <div class="text-center">
        <h1 class="display-4">Welcome to the Student Management System</h1>
        <p class="lead">Manage student records efficiently and easily.</p>
        <a href="/studentRegister" class="btn btn-success m-2">Register a Student</a>
        <a href="/studentList" class="btn btn-primary m-2">View Student List</a>
    </div>

    <div class="row mt-5">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h5 class="card-title">Register Student</h5>
                    <p class="card-text">Click here to add a new student to the database.</p>
                    <a href="/studentRegister" class="btn btn-outline-success">Register</a>
                </div>
            </div>
        </div>
        <div class="col-md-6 mt-4 mt-md-0">
            <div class="card shadow">
                <div class="card-body">
                    <h5 class="card-title">View Students</h5>
                    <p class="card-text">See the full list of students with details and marks.</p>
                    <a href="/studentList" class="btn btn-outline-primary">View List</a>
                </div>
            </div>
        </div>
    </div>
</div>


</body>
</html>
