<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students | Student Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Admin CSS -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">

    <!-- Student CSS -->
    <link rel="stylesheet" th:href="@{/css/student.css}">
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>


<!-- MAIN CONTENT -->
<div class="main-wrapper">

    <main class="page-content">

        <!-- PAGE HEADING -->
        <div class="page-heading">

            <div>
                <h3>
                    <i class="bi bi-people-fill"></i>
                    Student List </h3>

                <p>
                    Manage registered students in the system. </p>
            </div>

            <a th:href="@{/students/add}" class="add-student-button">

                <i class="bi bi-person-plus-fill"></i>
                Add Student

            </a>

        </div>


        <!-- STUDENT LIST CARD -->
        <div class="student-list-card">

            <!-- CARD HEADER -->
            <div class="student-list-header">

                <div>
                    <h5>All Students</h5>

                    <p>
                        Total Students:
                        <strong th:text="${#lists.size(students)}">0</strong>
                    </p>
                </div>


                <!-- SEARCH -->
                <div class="student-search">

                    <i class="bi bi-search"></i>

                    <input type="text" id="studentSearch" placeholder="Search students...">

                </div>

            </div>


            <!-- TABLE -->
            <div class="table-responsive">

                <table class="student-list-table" id="studentTable">

                    <thead>
                    <tr>
                        <th class="text-center">#</th>
                        <th>Student</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Course</th>
                        <th>Address</th>
                        <th class="text-center">Actions</th>
                    </tr>
                    </thead>


                    <tbody>

                    <!-- STUDENT ROW -->
                    <tr th:each="student, stat : ${students}" class="student-row">

                        <td class="text-center" th:text="${stat.count}">
                            1
                        </td>


                        <!-- STUDENT -->
                        <td>

                            <div class="student-info">

                                <div class="student-avatar">
                                    <span th:text="${#strings.substring(student.name, 0, 1).toUpperCase()}">
                                        S
                                    </span>
                                </div>

                                <div>
                                    <div class="student-name" th:text="${student.name}">
                                        Student Name
                                    </div>

                                    <small>
                                        Student
                                    </small>
                                </div>

                            </div>

                        </td>


                        <!-- EMAIL -->
                        <td th:text="${student.email}">
                            student@email.com
                        </td>


                        <!-- PHONE -->
                        <td th:text="${student.phoneNumber}">
                            9800000000
                        </td>


                        <!-- COURSE -->
                        <td>

                            <span class="course-badge" th:text="${student.course}">
                                BIM
                            </span>

                        </td>


                        <!-- ADDRESS -->
                        <td th:text="${student.address}">
                            Kathmandu
                        </td>


                        <!-- ACTIONS -->
                        <td class="text-center">

                            <div class="student-actions">

                                <!-- VIEW -->
                                <a th:href="@{/students/view/{id}(id=${student.id})}" class="table-action view-action" title="View Student">

                                    <i class="bi bi-eye"></i>

                                </a>


                                <!-- EDIT -->
                                <a th:href="@{/students/std/edit/{id}(id=${student.id})}" class="table-action edit-action" title="Edit Student">

                                    <i class="bi bi-pencil"></i>

                                </a>


                                <!-- DELETE -->
                                <a th:href="@{/students/students/delete/{id}(id=${student.id})}" class="table-action delete-action" title="Delete Student" onclick="return confirm('Are you sure you want to delete this student?');">

                                    <i class="bi bi-trash"></i>

                                </a>

                            </div>

                        </td>

                    </tr>


                    <!-- NO DATA -->
                    <tr th:if="${#lists.isEmpty(students)}">

                        <td colspan="7" class="empty-students">

                            <i class="bi bi-people"></i>

                            <p>
                                No students found. </p>

                        </td>

                    </tr>


                    <!-- NO SEARCH RESULT -->
                    <tr id="noSearchResult" style="display: none;">

                        <td colspan="7" class="empty-students">

                            <i class="bi bi-search"></i>

                            <p>
                                No matching student found. </p>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <!-- FOOTER -->
        <div th:replace="~{fragments/footer :: footer}"></div>

    </main>

</div>


<!-- SEARCH SCRIPT -->
<script>

    document.addEventListener("DOMContentLoaded", function () {

        const searchInput = document.getElementById("studentSearch");
        const studentRows = document.querySelectorAll(".student-row");
        const noSearchResult = document.getElementById("noSearchResult");

        searchInput.addEventListener("input", function () {

            const searchValue = searchInput.value
                .toLowerCase()
                .trim();

            let found = false;

            studentRows.forEach(function (row) {

                const rowText = row.textContent
                    .toLowerCase()
                    .trim();

                if (rowText.includes(searchValue)) {

                    row.style.display = "";
                    found = true;

                } else {

                    row.style.display = "none";

                }

            });


            if (searchValue !== "" && !found) {

                noSearchResult.style.display = "";

            } else {

                noSearchResult.style.display = "none";

            }

        });

    });

</script>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
