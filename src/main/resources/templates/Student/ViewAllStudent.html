<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-sm navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="/home">Student Portal</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/studentRegister">Student Register</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/studentList">Student List</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

    <div class="container">
        <table class="table table-stripped">
            <thead>
                <tr>
                  <th>FullName</th>
                  <th>Email</th>
                  <th>Address</th>
                  <th>Math Marks</th>
                  <th>Social Marks</th>
                  <th>Total Marks</th>
                    <th> Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s:${student}">
                    <td>[[${s.name}]]</td>
                    <td>[[${s.email}]]</td>
                    <td>[[${s.address}]]</td>
                    <td>[[${s.mathMarks}]]</td>
                    <td>[[${s.socialMarks}]]</td>
                    <td>[[${s.totalMarks}]]</td>
                    <td>
                        <a th:href="@{/std/edit(id=${s.id})}"><input type="submit" class="btn btn-primary" value="Edit"></a>
                        <a th:href="@{/std/delete(id=${s.id})}"><input type="submit" class="btn btn-danger" value="Delete"></a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
