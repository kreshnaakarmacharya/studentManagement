<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Subject | Student Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/subject.css}">
</head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-wrapper">
    <main class="page-content">

        <!-- PAGE HEADING -->
        <div class="page-heading">
            <div>
                <h3>
                    <i class="bi bi-book-half"></i>
                    Add Subject </h3>
                <p>Add a new subject to the course</p>
            </div>

            <a th:href="@{/subjects/subjectList(courseId=${courseId})}" class="back-button">
                <i class="bi bi-arrow-left"></i>
                Back to Subjects
            </a>
        </div>

        <!-- FORM CARD -->
        <div class="subject-form-card">

            <!-- FORM HEADER -->
            <div class="subject-form-header">

                <div class="form-header-icon">
                    <i class="bi bi-book-half"></i>
                </div>

                <div>
                    <h5>Subject Information</h5>
                    <p>Enter the details of the new subject</p>
                </div>

            </div>

            <!-- FORM BODY -->
            <div class="subject-form-body">

                <form th:action="@{/subjects/addSubject}" method="post">

                    <input type="hidden" name="courseId" th:value="${courseId}">

                    <!-- SECTION TITLE -->
                    <div class="form-section-title">

                        <div class="section-icon">
                            <i class="bi bi-info-circle-fill"></i>
                        </div>

                        <div>
                            <h5>Basic Information</h5>
                            <p>Enter the basic subject details</p>
                        </div>

                    </div>

                    <div class="row g-4">

                        <!-- SUBJECT CODE -->
                        <div class="col-md-6">

                            <label for="subjectCode" class="custom-label">
                                Subject Code <span>*</span>
                            </label>

                            <div class="custom-input-group">

                                <i class="bi bi-hash"></i>

                                <input type="text" id="subjectCode" name="subjectCode" placeholder="Enter subject code" required>

                            </div>

                        </div>

                        <!-- SUBJECT NAME -->
                        <div class="col-md-6">

                            <label for="subjectName" class="custom-label">
                                Subject Name <span>*</span>
                            </label>

                            <div class="custom-input-group">

                                <i class="bi bi-book"></i>

                                <input type="text" id="subjectName" name="subjectName" placeholder="Enter subject name" required>

                            </div>

                        </div>

                        <!-- SEMESTER -->
                        <div class="col-md-6">

                            <label for="semester" class="custom-label">
                                Semester <span>*</span>
                            </label>

                            <div class="custom-input-group">

                                <i class="bi bi-layers-fill"></i>

                                <input type="number" id="semester" name="semesterNumber" placeholder="Enter semester number" min="1" required>

                            </div>

                        </div>

                    </div>

                    <!-- DIVIDER -->
                    <div class="form-divider"></div>

                    <!-- ACTIONS -->
                    <div class="form-actions">

                        <button type="reset" class="reset-button">

                            <i class="bi bi-arrow-counterclockwise"></i>
                            Reset

                        </button>

                        <button type="submit" class="save-button">

                            <i class="bi bi-check-lg"></i>
                            Add Subject

                        </button>

                    </div>

                    <!-- NOTE -->
                    <div class="form-note">

                        <i class="bi bi-info-circle-fill"></i>

                        <span>
                            Fields marked with <strong>*</strong> are required.
                        </span>

                    </div>

                </form>

            </div>

        </div>

        <!-- FOOTER -->
        <div th:replace="~{fragments/footer :: footer}"></div>

    </main>
</div>

</body>
</html>
